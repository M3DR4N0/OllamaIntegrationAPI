version: "3.9"

services:
  llamaintegrationapi:
    build:
      context: .
      dockerfile: LlamaIntegrationAPI/Dockerfile
      network: host
    ports:
      - "5000:8080"
    depends_on:
      - ollama
    volumes:
      # monta tu carpeta local tessdata dentro del contenedor
      - ./LlamaIntegrationAPI/tessdata:/app/tessdata:ro
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - OLLAMA_HOST=http://ollama:11434

  ollama:
    image: ollama/ollama:latest
    #container_name: ollama
    restart: unless-stopped
    ports:
        - "11434:11434"       # expone el API de Ollama
    volumes:
        - ollama_models:/root/.ollama  # cache/modelos persistentes
    environment:
        - OLLAMA_HOST=0.0.0.0:11434    # expone en todas las interfaces

volumes:
  ollama_models:


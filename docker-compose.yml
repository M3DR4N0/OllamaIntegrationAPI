version: "3.9"

services:
  ollamaintegrationapi:
    build:
      context: .
      dockerfile: OllamaIntegrationAPI/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - llamacpp
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - LLAMA_HOST=http://llamacpp:11220

  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-vl
    restart: unless-stopped
    ports:
      - "11220:11220"
    command:
      # Model from Hugging Face (cached)
      - "-hf"
      - "unsloth/Qwen2.5-VL-7B-Instruct-GGUF:Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf"

      # Vision projector from HF (cached)
      - "--mmproj-url"
      - "https://huggingface.co/QuantStack/Qwen-Image-Edit-GGUF/resolve/main/mmproj/Qwen2.5-VL-7B-Instruct-mmproj-BF16.gguf"

      # Conservative startup params
      - "-c"
      - "8192"
      - "-ngl"
      - "0"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "11220"
      - "--embedding"
    volumes:
      - ./llama-cache:/root/.cache/llama.cpp
      - ./hf-cache:/root/.cache/huggingface
    environment:
      # Read token from .env file to avoid committing it
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
